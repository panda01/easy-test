# Runs every unit test (backend + frontend) with coverage on each push to
# master. `npm run test:coverage` is `vitest run --coverage`, so this one step
# both runs the whole suite AND enforces the global thresholds in
# vitest.config.ts (lines 80 / branches 70 / functions 80 / statements 80).
# A failing test or a threshold miss fails the job.
name: Tests

on:
  push:
    branches: [master]

jobs:
  test-with-coverage:
    name: Unit tests + coverage
    runs-on: ubuntu-latest

    # Throwaway PostgreSQL for this job only. `npm ci` triggers `postinstall`,
    # whose `prisma db push` needs a live database to push the real schema to.
    # No unit test talks to the database - every spec mocks dbService or the
    # Prisma client - so it exists to let the install run exactly as it does
    # locally (and to prove the schema still pushes cleanly). Version 18
    # matches the local Homebrew PostgreSQL noted in `.env`.
    #
    # The health check makes the runner wait until Postgres accepts
    # connections before any step runs, so `db push` never races start-up.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: easy_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d easy_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Points Prisma at the service above. Job-level env wins over the
      # committed `.env`: server/bootEnv.ts loads it with dotenv, which never
      # overwrites a key that is already set.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/easy_test_ci?schema=public

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # `node-version-file: package.json` reads `engines.node` (=26.12.0), so
      # the Node version lives in one place. `cache: npm` caches ~/.npm keyed
      # on package-lock.json.
      - name: Set up Node from package.json engines
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      # Runs postinstall exactly as a local install does: `prisma generate`
      # (the tests import the generated client), `prisma db push` (into the
      # Postgres service above), and `playwright install chromium`.
      - name: Install dependencies
        run: npm ci

      - name: Run all tests with coverage
        run: npm run test:coverage
